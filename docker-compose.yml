version: '3.8'

# SpaceGuard AI — Docker Compose (Development)
# Future: Will include all services for one-command startup

services:
  mongodb:
    image: mongo:7
    container_name: spaceguard-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=spaceguard

